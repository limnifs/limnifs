[workspace]
members = ["limnifs-format", "limnifs-core", "limnifs-conformance", "limnifs-write", "limni", "limnifs-bench", "limnifs-ocb3"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.3.10"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/limnifs/limnifs"
homepage = "https://www.limnifs.org"
description = "LimniFS — Layered, Immutable, Merkle-rooted, Network Image filesystem"

[workspace.lints.rust]
# `deny` (not `forbid`) so that audited OS-level operations like mmap
# can use `#[allow(unsafe_code)]` with a SAFETY comment. Every unsafe
# block must justify its safety invariant in a comment.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Internal crates (omnizip-style: members reference these as
# `limnifs-core.workspace = true`; release-plz bumps the shared
# workspace version once and publishes in DAG order).
limnifs-format = { path = "limnifs-format", version = "0.3.10" }
limnifs-ocb3 = { path = "limnifs-ocb3", version = "0.3.10" }
limnifs-core = { path = "limnifs-core", version = "0.3.10" }
limnifs-write = { path = "limnifs-write", version = "0.3.10" }
aes-gcm = "0.10"
blake3 = { version = "1.8.7", default-features = false, features = ["std", "rayon"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
clap = { version = "4.5", features = ["derive", "string"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
getrandom = "0.2"
hkdf = { version = "0.12", default-features = false }
memmap2 = "0.9"
rand_core = { version = "0.6", default-features = false }
rayon = "1.10"
sha2 = { version = "0.10", default-features = false }
toml = "0.8"
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "getrandom"] }

