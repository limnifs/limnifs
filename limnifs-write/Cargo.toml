[package]
name = "limnifs-write"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LimniFS writer pipeline — directory tree to .lim image"

[dependencies]
limnifs-format = { path = "../limnifs-format", version = "0.2.0" }
limnifs-core = { path = "../limnifs-core", version = "0.2.0" }
crossbeam-channel = { version = "0.5", optional = true }
lz4_flex.workspace = true
omnizip-flac = "0.10"
rayon.workspace = true
serde.workspace = true
thiserror = "1.0"
toml.workspace = true

[features]
default = []
# Opt-in: producer/consumer pipeline that overlaps file I/O with
# compression across N read + M compress threads. Off by default —
# the simple `par_iter().map(process_file)` shape is faster on
# warm cache. Enable for cold-cache or network-attached workloads.
pipeline-parallelism = ["dep:crossbeam-channel"]
# Opt-in: cross-image Bloom-filter dedup index. Standalone today
# (no writer integration); emit `<image>.sparse` alongside
# `<image>.lim` so consumers can ask "is this drop already in
# image X?" without scanning the slabs.
sparse-index = []

[lints]
workspace = true
