[package]
name = "limnifs-write"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LimniFS writer pipeline — directory tree to .lim image"

[dependencies]
limnifs-format.workspace = true
limnifs-core.workspace = true
memmap2.workspace = true
omnizip-flac = "0.21.20"
rayon.workspace = true
serde.workspace = true
thiserror = "1.0"
toml.workspace = true

[features]
default = []
# Opt-in: producer/consumer pipeline that overlaps file I/O with
# compression across N read + M compress threads. Off by default —
# the simple `par_iter().map(process_file)` shape is faster on
# warm cache. Enable for cold-cache or network-attached workloads.
# Opt-in: cross-image Bloom-filter dedup index. Emits/wires
# `<image>.sparse` so layer builds answer "is this drop already in
# the base?" without opening its slabs (see `BaseDropSet`).
sparse-index = []

[lints]
workspace = true
