[package]
name = "limni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LimniFS CLI — one format, one CLI"

[[bin]]
name = "limni"
path = "src/main.rs"

[dependencies]
limnifs-core = { workspace = true, features = ["signing"] }
serde = { workspace = true }
serde_json = { workspace = true }
limnifs-write.workspace = true
clap.workspace = true
getrandom.workspace = true
rayon.workspace = true
tar = { version = "0.4", optional = true, default-features = false }
memmap2 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# FUSE is Unix-only: fuser's build script pkg-config-probes libfuse
# and panics on Windows, so the dep (and with it the whole `fuse`
# feature) is inert off Unix — the v0.3.39 xattr precedent.
fuser = { version = "0.18", optional = true, default-features = false }
xattr = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.18", optional = true, default-features = false, features = ["macos-no-mount"] }

[features]
default = []
fuse = ["dep:fuser"]
tar = ["dep:tar", "dep:memmap2"]
xattr = ["limnifs-write/xattr", "dep:xattr"]
sparse-index = ["limnifs-write/sparse-index"]

[lints]
workspace = true
