name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-shims:
    name: No-shims gate
    uses: limnifs/.github/.github/workflows/no-shims-gate.yml@main

  license-scan:
    name: License scan (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features

  rust:
    name: Rust matrix
    uses: limnifs/.github/.github/workflows/rust-ci.yml@main

  # Native Windows build check. The Linux+macOS matrices above do not
  # compile Windows-only cfg branches; v0.3.2 shipped a broken Windows
  # build (unix-only memmap2::Advice) through 14 green PR checks
  # because only the release workflow's 7-platform matrix caught it —
  # after crates.io publish had already happened. This job gates the
  # same class of break at PR time.
  windows:
    name: Windows check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-check
      # Default features = what the release matrix ships on Windows.
      # --all-features would pull the `fuse` feature, whose fuser
      # dependency cannot build there (WinFSP), and that combination
      # is never published.
      - name: cargo check (all targets, default features)
        run: cargo check --workspace --all-targets
      - name: cargo check (all features except fuse)
        # fuser cannot build on Windows; exercise everything else so
        # cfg-gated code paths (http, key-wrap, signing, sparse-index)
        # compile on this target.
        run: >-
          cargo check --workspace --all-targets
          --features limnifs-core/http,limnifs-core/key-wrap,limnifs-core/signing,limnifs-write/sparse-index
      - name: cargo test (default features)
        # Check proves compilation; tests prove behavior — path
        # separators, mmap semantics, and hard-link fallbacks can all
        # compile green and fail at runtime. This upgrades the Windows
        # gate from "it builds" to "it round-trips".
        #
        # Step-level timeout: a healthy run is 4-6 min; past 15 is a
        # hang by definition (the omnizip-brotli 0.21.15 DP hang —
        # omnizip-rs#388 — burned the full 30-min job budget before
        # cancelling). Fails fast, named, runner freed.
        timeout-minutes: 15
        run: cargo test --workspace --quiet
