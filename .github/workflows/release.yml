name: Release

# Release pipeline (aligned with omnizip-rs / parsanol-rs).
#
# Two triggers, two halves:
#
# - push to main → release-plz publishes the workspace crates to
#   crates.io via trusted publishing (OIDC; crates.io Publishers:
#   GitHub Actions / limnifs / limnifs / release.yml) and creates
#   per-crate tags `<crate>-vX.Y.Z`. Version bumps land on main as
#   commits; release-plz never publishes from a laptop.
# - tag push (`v*` or release-plz's `limni-v*`) → binary pipeline:
#   cargo-deny license scan, CycloneDX SBOM, 4-target build,
#   checksums, GitHub Release upload.
#
# Sigstore keyless signing is deferred — v1 ships Ed25519 keypair
# signatures via `limni limn --sign-key` (see limnifs-core/src/signing.rs).

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "limni-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz (crates.io)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # push per-crate tags
      contents: write
      # crates.io trusted publishing (OIDC token exchange)
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Mint short-lived crates.io token (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5.131
        with:
          # release only — same as omnizip-rs: no release PR (GitHub
          # Actions can't open PRs here without a PAT). Version bumps
          # arrive on main as commits; this publishes + tags them.
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  license-scan:
    name: License scan (cargo-deny)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features

  sbom:
    name: SBOM (CycloneDX)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version ^0.5
      - name: Generate SBOM
        run: |
          # cargo-cyclonedx 0.5.x: no --workspace; pass the workspace manifest.
          cargo cyclonedx --manifest-path ./Cargo.toml -f json --all-features
          find . -name '*.cdx.json' -print

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            **/*.cdx.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [license-scan, sbom]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin limni
      - name: Package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##*/}"
          if [ -z "$tag" ] || [ "$tag" = "refs/heads/main" ]; then
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ]; then
            tag="dev"
          fi
          # release-plz tags already carry the limni- prefix (limni-vX.Y.Z);
          # plain v* tags get it added.
          case "$tag" in limni-*) ;; *) tag="limni-$tag" ;; esac
          staging="${tag}-${{ matrix.target }}"
          mkdir "$staging"
          cp target/${{ matrix.target }}/release/limni "$staging/"
          cp README.md LICENSE-* "$staging/" 2>/dev/null || true
          tar czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: limni-${{ matrix.target }}
          path: |
            limni-*.tar.gz
            limni-*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [license-scan, sbom, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
      - name: Display structure
        run: find release -type f | sort
      - name: Flatten SBOM files for release upload
        run: |
          mkdir -p release/sbom-flat
          find release/sbom -name '*.cdx.json' -exec cp {} release/sbom-flat/ \;
          ls -la release/sbom-flat/
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/limni-*/*.tar.gz
            release/limni-*/*.sha256
            release/sbom-flat/*.cdx.json
          generate_release_notes: true
          fail_on_unmatched_files: false
