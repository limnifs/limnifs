name: Release

# Release pipeline (aligned with omnizip-rs / parsanol-rs).
#
# Two triggers, two halves:
#
# - push to main → release-plz publishes the workspace crates to
#   crates.io via trusted publishing (OIDC; crates.io Publishers:
#   GitHub Actions / limnifs / limnifs / release.yml) and creates
#   per-crate tags `<crate>-vX.Y.Z`. Version bumps land on main as
#   commits; release-plz never publishes from a laptop.
# - tag push (`v*` or release-plz's `limni-v*`) → binary pipeline:
#   cargo-deny license scan, CycloneDX SBOM, 4-target build,
#   checksums, GitHub Release upload.
#
# Sigstore keyless signing is deferred — v1 ships Ed25519 keypair
# signatures via `limni limn --sign-key` (see limnifs-core/src/signing.rs).

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "limni-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz (crates.io)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # push per-crate tags
      contents: write
      # crates.io trusted publishing (OIDC token exchange)
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Mint short-lived crates.io token (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5.131
        with:
          # release only — same as omnizip-rs: no release PR (GitHub
          # Actions can't open PRs here without a PAT). Version bumps
          # arrive on main as commits; this publishes + tags them.
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # release-plz pushes tags with GITHUB_TOKEN, and GITHUB_TOKEN-created
  # events never trigger workflows — so the binary pipeline cannot ride
  # the tag push. Instead the same run chains: if release-plz just
  # created the `limni-vX.Y.Z` tag for the current workspace version,
  # downstream jobs build and publish the release from it.
  context:
    name: Release context
    needs: release-plz
    if: github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.ctx.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect freshly tagged release
        id: ctx
        run: |
          ver="$(grep -m1 '^version' Cargo.toml | tr -d ' "' | cut -d= -f2)"
          if git rev-parse -q --verify "refs/tags/limni-v${ver}" >/dev/null 2>&1; then
            echo "tag=limni-v${ver}" >> "$GITHUB_OUTPUT"
            echo "chained release: limni-v${ver}"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "no release-plz tag for v${ver} — binary jobs skip"
          fi

  # Hard perf gates run inside the release itself: the publish job
  # requires this job's success, so a create/read regression (the
  # v0.3.3 materialization class, or a codec-dependency cliff)
  # cannot reach crates.io with a red canary.
  perf-gate:
    name: Perf gate (readperf + createperf)
    needs: context
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || needs.context.outputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf-gate
      - name: Read-path canaries (hard gates)
        run: cargo run --release -p limnifs-bench -- readperf
      - name: Create-path canary (hard gate)
        run: cargo run --release -p limnifs-bench -- createperf

  license-scan:
    name: License scan (cargo-deny)
    needs: context
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || needs.context.outputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features

  sbom:
    name: SBOM (CycloneDX)
    needs: context
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || needs.context.outputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version ^0.5
      - name: Generate SBOM
        run: |
          # cargo-cyclonedx 0.5.x: no --workspace; pass the workspace manifest.
          cargo cyclonedx --manifest-path ./Cargo.toml -f json --all-features
          find . -name '*.cdx.json' -print

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            **/*.cdx.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [license-scan, sbom, context]
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || needs.context.outputs.tag != '') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64-gnu cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install cross (aarch64-musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked
      - name: Configure aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # Ship the CLI's opt-in capabilities in the project's own
      # binaries: tar streaming (limn --from-tar / limni tar) and
      # the sparse-index layer fast path. Library installs stay
      # sovereign — the features remain opt-in there.
      - name: Build release binary (cross)
        if: ${{ matrix.use_cross }}
        run: cross build --release --locked --target ${{ matrix.target }} --bin limni --features tar,sparse-index
      - name: Build release binary
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin limni --features tar,sparse-index
      - name: Package
        shell: bash
        env:
          # Chained runs (release-plz just tagged) resolve via the
          # context output; tag-push runs fall back to the ref name.
          RELEASE_TAG: ${{ needs.context.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          # release-plz tags already carry the limni- prefix (limni-vX.Y.Z);
          # plain v* tags get it added.
          case "$tag" in limni-*) ;; *) tag="limni-$tag" ;; esac
          staging="${tag}-${{ matrix.target }}"
          bin=limni
          if [ "$RUNNER_OS" = "Windows" ]; then bin=limni.exe; fi
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/$bin" "$staging/"
          cp README.md LICENSE-* "$staging/" 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            tar -a -cf "${staging}.zip" "$staging"
            certutil -hashfile "${staging}.zip" SHA256 | sed -n 2p | tr -d "\r" > "${staging}.zip.sha256"
          else
            tar czf "${staging}.tar.gz" "$staging"
            shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: limni-${{ matrix.target }}
          path: |
            limni-*.tar.gz
            limni-*.zip
            limni-*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [license-scan, sbom, build, context, perf-gate]
    # !cancelled() keeps the existing semantics (a partial build
    # failure doesn't block the rest), but the perf gate is absolute:
    # a red canary skips the publish and the release fails closed.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || needs.context.outputs.tag != '') && needs.perf-gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
      - name: Display structure
        run: find release -type f | sort
      - name: Flatten SBOM files for release upload
        run: |
          mkdir -p release/sbom-flat
          find release/sbom -name '*.cdx.json' -exec cp {} release/sbom-flat/ \;
          ls -la release/sbom-flat/
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        # A transient GitHub 5xx on one asset must not fail the
        # release: the verify step below re-uploads everything with
        # --clobber (idempotent) and fails only if assets stay missing.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.context.outputs.tag || github.ref_name }}
          files: |
            release/limni-*/*.tar.gz
            release/limni-*/*.zip
            release/limni-*/*.sha256
            release/sbom-flat/*.cdx.json
          generate_release_notes: true
          fail_on_unmatched_files: false
      - name: Ensure release assets complete (idempotent retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${{ needs.context.outputs.tag || github.ref_name }}"
          repo="${GITHUB_REPOSITORY}"
          # Create the release if the action died before creating it.
          gh release view "$tag" -R "$repo" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$repo" --generate-notes --verify-tag
          # Expected asset set (no spaces in names by construction).
          mapfile -t files < <(find release/limni-* release/sbom-flat -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name '*.cdx.json' \) | sort)
          echo "expected ${#files[@]} assets for $tag"
          for attempt in 1 2 3; do
            if gh release upload "$tag" -R "$repo" --clobber "${files[@]}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "asset upload failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          have=$(gh release view "$tag" -R "$repo" --json assets --jq '.assets | length')
          if [ "$have" -lt "${#files[@]}" ]; then
            echo "release has $have assets, expected at least ${#files[@]}"
            exit 1
          fi
          echo "release $tag complete: $have assets"
