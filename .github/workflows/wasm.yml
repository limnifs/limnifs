# Build and publish `@limnifs/limni-wasm` to npm via **trusted publishing**.
#
# Skips cleanly when the `limnifs-wasm` crate is not yet in the tree.
#
# npm trusted publishing uses OIDC: no long-lived NPM_TOKEN secret.
# Triggered on release tags (v*.*.*) and via workflow_dispatch.

name: Release WASM

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.wasm_crate.outputs.present }}
    steps:
      - uses: actions/checkout@v7

      - name: Check limnifs-wasm crate exists
        id: wasm_crate
        run: |
          if [ -f limnifs-wasm/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "limnifs-wasm crate not in tree yet — skipping WASM build/publish"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.wasm_crate.outputs.present == 'true'
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        if: steps.wasm_crate.outputs.present == 'true'
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM package
        if: steps.wasm_crate.outputs.present == 'true'
        run: |
          wasm-pack build limnifs-wasm \
            --target bundler \
            --release \
            --scope limnifs

      - name: Inspect package
        if: steps.wasm_crate.outputs.present == 'true'
        run: ls -la limnifs-wasm/pkg/

      - name: Upload artifact
        if: steps.wasm_crate.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: limnifs-wasm-pkg
          path: limnifs-wasm/pkg/

  publish-npm:
    needs: build-wasm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.build-wasm.outputs.present == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: limnifs-wasm-pkg
          path: pkg/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --access public
        working-directory: pkg/
