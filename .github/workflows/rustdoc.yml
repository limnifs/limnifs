# Build and publish RustDoc API documentation for all workspace crates.
#
# Deploys to GitHub Pages at the `rustdoc` environment, alongside the
# AsciiDoc project documentation deployed by docs.yml.

name: RustDoc

on:
  push:
    branches:
      - main
    paths:
      - "limni/**"
      - "limnifs-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rustdoc.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustdoc-pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build RustDoc
        run: |
          cargo doc --workspace --no-deps --all-features
          # Generate top-level index page from actual workspace members.
          cat > target/doc/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head><title>LimniFS RustDoc</title></head>
          <body>
          <h1>LimniFS RustDoc</h1>
          <p>API documentation for all workspace crates.</p>
          <ul>
          HTMLEOF
          for crate_dir in limni limnifs-*/; do
            crate_name=$(basename "$crate_dir")
            rustdoc_name="${crate_name//-/_}"
            if [ -d "target/doc/${rustdoc_name}" ]; then
              echo "<li><a href=\"${rustdoc_name}/index.html\">${crate_name}</a></li>" >> target/doc/index.html
            fi
          done
          cat >> target/doc/index.html <<'HTMLEOF'
          </ul>
          <p>Project documentation: <a href="https://limnifs.org">limnifs.org</a></p>
          </body>
          </html>
          HTMLEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: rustdoc
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
