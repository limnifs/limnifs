name: Benchmark

# Runs the Rust benchmark suite (`limnifs-bench`) on every release tag and
# on push to main (synthetic-only smoke test). Manual dispatch supports
# full runs (real datasets downloaded from public mirrors).
#
# Cross-format benchmarks (tar+zstd, squashfs, dwarfs) run only if the
# relevant tool is installed; the LimniFS column always appears.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  # PRs run the hard-gate canary only (the dataset matrix below is
  # excluded via its `if`) — a create/read regression surfaces in the
  # PR, not after the release ships.
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Quick (synthetic) or full (all datasets, ~2 GB download)"
        required: false
        default: "quick"
        type: choice
        options: ["quick", "full"]
      iterations:
        description: "Iterations per measurement"
        required: false
        default: "3"
        type: string

permissions:
  # Only the dataset-matrix job (release artifact upload) writes;
  # the canary is read-only so PR runs stay least-privilege.
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-canary:
    name: Read-path canary
    runs-on: ubuntu-latest
    # The hard gates finish by ~minute 2; the informational BCJ
    # bench (two full packs of 256 MiB staged ELF) needs 9-12 min
    # on a loaded runner — 10 min canceled it after it had already
    # printed its result. 20 keeps headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: read-canary
      - name: Run readperf canaries (hard gates)
        run: cargo run --release -p limnifs-bench -- readperf
      - name: Run createperf canary (hard gate)
        run: cargo run --release -p limnifs-bench -- createperf
      - name: Monolithic vs seekable A/B (informational)
        run: cargo run --release -p limnifs-bench -- readcompare
      - name: BCJ vs plain LZ4 over real ELF binaries (informational)
        run: cargo run --release -p limnifs-bench -- bcj --dir /usr/bin

  benchmark:
    name: Benchmark (${{ matrix.os }})
    # Dataset matrix is main/tag/dispatch only — PRs get the canary.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      # Attaches bench artifacts to tag releases.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-${{ matrix.os }}

      - name: Install comparison tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools zstd
          sudo apt-get install -y --no-install-recommends dwarfs || \
            echo "dwarfs not packaged on this runner; will skip"

      - name: Install comparison tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install zstd
          brew install squashfs || echo "squashfs not in homebrew"
          brew install dwarfs || echo "dwarfs not in homebrew"

      - name: Build limnifs-bench
        run: cargo build --release -p limnifs-bench

      - name: Build limni (for extract benchmark)
        run: cargo build --release -p limni

      - name: Run benchmark (quick smoke)
        if: github.event_name == 'push' || inputs.mode != 'full'
        run: cargo run --release -p limnifs-bench -- run --quick --iterations "${{ inputs.iterations || '3' }}"

      - name: Run benchmark (full)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          cargo run --release -p limnifs-bench -- download --all
          cargo run --release -p limnifs-bench -- run --all --iterations "${{ inputs.iterations || '3' }}"

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmarks/results/bench_*.json
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            benchmarks/results/bench_*.json
            benchmarks/results/bench_*.md
