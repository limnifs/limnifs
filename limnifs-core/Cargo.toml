[package]
name = "limnifs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LimniFS core reader — manifest parse, drop store, overlay resolution"

[dependencies]
limnifs-format.workspace = true
limnifs-ocb3.workspace = true
aes-gcm.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
memmap2.workspace = true
ed25519-dalek = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
libc = "0.2"
omnizip-blosc = "0.21.26"
# HELD at 0.21.20: 0.21.26 replaced the #388-era hard MATCH_LEN_CAP
# (1951) with an env-var knob defaulting to 16,779,211 — effectively
# UNCAPPED — justified by fixture wins ("8.7KB on bin1") with no
# worst-case analysis. Same regression class as omnizip-rs#388: local
# gates pass at 0.21.26 (28s, as the 65K cap did on macOS) while the
# unbounded DP sweep stays a landmine for downstream content on
# slower machines. Un-pin when the cap regains a bounded default.
omnizip-brotli = "0.21.20"
omnizip-bzip2 = "0.21.26"
omnizip-codecs = "0.21.26"
omnizip-deflate = "0.21.26"
omnizip-deflate64 = "0.21.26"
omnizip-filters = "0.21.26"
omnizip-flac = "0.21.26"
omnizip-fsst = "0.21.26"
omnizip-glza = "0.21.26"
omnizip-libdeflate = "0.21.26"
omnizip-lz4 = "0.21.26"
omnizip-lzma = "0.21.26"
omnizip-ppmd = "0.21.26"
omnizip-ricepp = "0.21.26"
omnizip-snappy = "0.21.26"
omnizip-zpaq = "0.21.26"
omnizip-zstd = "0.21.26"
rand_core = { workspace = true, optional = true }
rayon.workspace = true
sha2 = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }

[dev-dependencies]
getrandom = { workspace = true }
limnifs-write = { path = "../limnifs-write" }
tempfile = "3"

[features]
default = []
http = []
io-uring = []
key-wrap = ["dep:hkdf", "dep:rand_core", "dep:sha2", "dep:x25519-dalek"]
signing = ["dep:ed25519-dalek", "dep:rand_core"]

[lints]
workspace = true
