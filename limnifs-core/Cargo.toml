[package]
name = "limnifs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LimniFS core reader — manifest parse, drop store, overlay resolution"

[dependencies]
limnifs-format = { path = "../limnifs-format", version = "0.2.0" }
limnifs-ocb3 = { path = "../limnifs-ocb3", version = "0.2.0" }
aes-gcm.workspace = true
blake3.workspace = true
brotli.workspace = true
chacha20poly1305.workspace = true
memmap2.workspace = true
ed25519-dalek = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
lz4_flex.workspace = true
miniz_oxide.workspace = true
omnizip-blosc = "0.13"
omnizip-brotli = "0.13"
omnizip-bzip2 = "0.13"
omnizip-codecs = "0.13"
omnizip-deflate = "0.13"
omnizip-deflate64 = "0.13"
omnizip-filters = "0.13"
omnizip-flac = "0.13"
omnizip-fsst = "0.13"
omnizip-glza = "0.13"
omnizip-lzma = "0.13"
omnizip-ppmd = "0.13"
omnizip-ricepp = "0.13"
omnizip-snappy = "0.13"
omnizip-zpaq = "0.13"
omnizip-zstd = "0.13"
rand_core = { workspace = true, optional = true }
rayon.workspace = true
ruzstd.workspace = true
sha2 = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }

[features]
default = []
http = []
key-wrap = ["dep:hkdf", "dep:rand_core", "dep:sha2", "dep:x25519-dalek"]
signing = ["dep:ed25519-dalek", "dep:rand_core"]

[lints]
workspace = true
